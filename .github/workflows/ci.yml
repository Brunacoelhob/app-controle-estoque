name: CI

on:
  push:
    branches: [main, 'melhoria/**']
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Migrações aplicam em um banco novo
        env:
          SECRET_KEY: chave-de-ci-0123456789abcdef
          DATABASE_URL: sqlite:////tmp/ci.db
        run: flask --app wsgi db upgrade

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack (MySQL + app) e confere o login
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          docker compose up -d --build --wait
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/dashboard)" = 302
          curl -sf localhost:8000/saude
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=80
      - run: docker compose down -v
        if: always()
